name: CI

on:
  push:
    branches: [master, main, ldo-v1]
    tags: ["*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-no-enzyme:
    name: Core (no MPI/Enzyme) · Julia ${{ matrix.julia-version }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: "1.11"
          - os: ubuntu-latest
            julia-version: "1.12"
          - os: macos-latest
            julia-version: "1.11"
          - os: windows-latest
            julia-version: "1.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate core dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run core tests without MPI or Enzyme
        run: julia --startup-file=no --project=. test/runtests_core.jl

  enzyme:
    name: Enzyme · Julia ${{ matrix.julia-version }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.11", "1.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate with MPI and Enzyme
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add([PackageSpec(name="MPI", version="0.20"), PackageSpec(name="Enzyme", version="0.13")])'
      - name: Run AD integration tests
        run: julia --startup-file=no --project=. test/runtests_ad.jl

  mpi:
    name: MPI (2 ranks) · Julia ${{ matrix.julia-version }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.11", "1.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate with Enzyme
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(PackageSpec(name="Enzyme", version="0.13"))'
      - name: Run two-rank MPI tests
        run: julia --startup-file=no --project=. test/runtests_mpi.jl

  full:
    name: Full package test · Julia 1.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
